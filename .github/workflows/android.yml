name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to test for version selection and rollback
        required: false
        type: string
      verify_live_site:
        description: Check the live game and rankings before testing reminder sounds
        default: true
        type: boolean
      debug_run_id:
        description: Reuse the debug APK from this Android workflow run
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.release_tag == '' && inputs.debug_run_id == '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: test -f "$ANDROID_HOME/platforms/android-35/android.jar" && test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rngdle-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  webview-smoke:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.debug_run_id != '' || needs.build.result == 'success') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.release_tag == ''
        with:
          name: rngdle-companion-debug
          github-token: ${{ github.token }}
          run-id: ${{ inputs.debug_run_id || github.run_id }}
      - name: Start an Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          image='system-images;android-35;google_apis;x86_64'
          "$sdkmanager" 'emulator' "$image"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd --force \
            --name rngdle-smoke --package "$image" --path "$ANDROID_AVD_HOME/rngdle-smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx rngdle-smoke
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd rngdle-smoke -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none \
            > "$RUNNER_TEMP/rngdle-emulator.log" 2>&1 &
          emulator_pid=$!
          for _ in {1..90}; do
            kill -0 "$emulator_pid" || { cat "$RUNNER_TEMP/rngdle-emulator.log"; exit 1; }
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then break; fi
            sleep 3
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          adb shell input keyevent 82
          adb shell wm size 540x960
          adb shell wm density 240
      - name: Verify the Android app
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFY_LIVE_SITE: ${{ inputs.verify_live_site }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tap_label() {
            local x y
            adb shell uiautomator dump /sdcard/navigation.xml
            adb pull /sdcard/navigation.xml navigation.xml
            read -r x y < <(python - "$1" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          nodes = ET.parse("navigation.xml").findall(".//node")
          nodes.sort(key=lambda node: not node.get("content-desc"))
          for node in nodes:
              labels = re.split(r"\n|, ", node.get("text", "")) + [node.get("content-desc")]
              if any(label and sys.argv[1].casefold() == label.casefold() for label in labels):
                  x1, y1, x2, y2 = map(int, re.findall(r"\d+", node.attrib["bounds"]))
                  if x1 == x2 or y1 == y2:
                      continue
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          else:
              raise SystemExit(f"Control is absent: {sys.argv[1]}")
          PY
            ) || return 1
            adb shell input tap "$x" "$y"
          }
          tap_settings_label() {
            for _ in {1..5}; do
              if tap_label "$1"; then return; fi
              adb shell input swipe 265 710 265 300 400
            done
            return 1
          }
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'rngdle-companion-vc*.apk'
            apks=(rngdle-companion-vc*.apk)
            [[ ${#apks[@]} == 1 && "${apks[0]}" =~ ^rngdle-companion-vc([1-9][0-9]*)\.apk$ ]]
            installed_code="${BASH_REMATCH[1]}"
            previous="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -se --argjson code "$installed_code" '
              add | map(select(.draft == false and .prerelease == false) | . as $release | .assets[]
                | select(.name | test("^rngdle-companion-vc[1-9][0-9]*\\.apk$"))
                | {file: .name, size, digest, tag: $release.tag_name,
                   label: (if ($release.name // "") == "" then $release.tag_name else $release.name end),
                   code: (.name | capture("vc(?<number>[0-9]+)").number | tonumber)})
              | map(select(.code < $code)) | max_by(.code)')"
            old_file="$(jq -r '.file' <<< "$previous")"
            old_size="$(jq -r '.size' <<< "$previous")"
            old_digest="$(jq -r '.digest | sub("^sha256:"; "")' <<< "$previous")"
            [[ "$old_digest" =~ ^[0-9a-f]{64}$ ]]
            package=app.rngdle.companion
            adb install -g "${apks[0]}"
            adb shell am start -W -n "$package/$package.MainActivity"
            trap 'adb exec-out screencap -p > rollback.png' EXIT
            tap_label "Настройки"
            tap_settings_label "Выбрать версию"
            tap_settings_label "$(jq -r '.label' <<< "$previous")"
            tap_settings_label "Скачать APK"
            tap_settings_label "Сохранить APK для отката"
            if tap_label "Show roots"; then tap_label "Downloads"; fi
            tap_label "Save"
            for _ in {1..20}; do
              if [[ "$(adb shell stat -c %s "/sdcard/Download/$old_file" 2>/dev/null | tr -d '\r' || true)" == "$old_size" ]]; then break; fi
              sleep 1
            done
            adb pull "/sdcard/Download/$old_file" archived.apk
            printf '%s  archived.apk\n' "$old_digest" | sha256sum -c -
            adb exec-out screencap -p > rollback-saved.png
            if adb install -r archived.apk > rollback.log 2>&1; then exit 1; fi
            grep -F INSTALL_FAILED_VERSION_DOWNGRADE rollback.log
            adb uninstall "$package"
            adb pull "/sdcard/Download/$old_file" archived.apk
            printf '%s  archived.apk\n' "$old_digest" | sha256sum -c -
            adb install archived.apk
            adb shell dumpsys package "$package" | grep -F "versionName=$(jq -r '.tag | ltrimstr("v")' <<< "$previous")"
            exit
          fi
          adb install -g app-debug.apk
          adb logcat -c
          adb shell am start -W -n app.rngdle.companion.debug/app.rngdle.companion.MainActivity
          wait_for_frame() {
            local expected="$1" count
            for _ in {1..36}; do
              count="$(adb logcat -d -s 'RNGdleWeb:I' '*:S' | grep -c 'frame_drawn width=' || true)"
              if (( count >= expected )); then return; fi
              sleep 2
            done
            return 1
          }
          trap 'adb logcat -d -s "RNGdleWeb:I" "RNGdleReminders:W" "*:S" > webview.log; adb exec-out screencap -p > smoke-final.png' EXIT
          if [[ "$VERIFY_LIVE_SITE" == true ]]; then
            wait_for_frame 1
            adb exec-out screencap -p > play.png
            tap_label "Рейтинг"
            wait_for_frame 2
            adb exec-out screencap -p > rankings.png
          fi
          tap_label "Настройки"
          tap_settings_label "Проверить уведомление"
          wait_for_notification() {
            for _ in {1..10}; do
              if adb shell dumpsys notification | grep -F 'app.rngdle.companion.debug' \
                | grep -E "id=28.*channel=$1" >> test-notification.log; then return; fi
              sleep 1
            done
            return 1
          }
          wait_for_notification roll_ready_v3
          adb exec-out run-as app.rngdle.companion.debug cat files/reminder-sound/roll_alert.wav > reminder-default.wav
          adb shell dumpsys activity permissions | grep -F 'app.rngdle.companion.debug.reminder-sound/sound/roll_alert.wav' >> test-notification.log
          read -r start end y < <(python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          for node in ET.parse("navigation.xml").iter("node"):
              if node.get("content-desc") == "Громкость уведомления":
                  x1, y1, x2, y2 = map(int, re.findall(r"\d+", node.attrib["bounds"]))
                  print(x1 + (x2 - x1) * 40 // 100, x1 + 2, (y1 + y2) // 2)
                  break
          PY
          )
          adb shell input swipe "$start" "$y" "$end" "$y" 600
          tap_settings_label "Проверить уведомление"
          wait_for_notification roll_ready_v3
          sleep 1
          adb exec-out run-as app.rngdle.companion.debug cat files/reminder-sound/roll_alert.wav > reminder-muted.wav
          python - <<'PY'
          import io
          import struct
          import wave
          from zipfile import ZipFile

          def samples(file):
              with wave.open(file, 'rb') as sound:
                  assert sound.getsampwidth() == 2
                  return [value for (value,) in struct.iter_unpack('<h', sound.readframes(sound.getnframes()))]

          with ZipFile('app-debug.apk') as apk:
              original = samples(io.BytesIO(apk.read('res/raw/roll_alert.wav')))
          default = samples('reminder-default.wav')
          muted = samples('reminder-muted.wav')
          assert default == [int(sample * 40 / 100) for sample in original], 'Expected 40% volume'
          assert len(muted) == len(original) and not any(muted), 'Expected 0% volume'
          PY
          sleep 8
          tap_settings_label "Будильник"
          sleep 2
          if adb shell dumpsys window | grep -E 'mCurrentFocus=.*com.android.settings'; then
            adb shell input keyevent KEYCODE_BACK
          fi
          tap_settings_label "Проверить уведомление"
          wait_for_notification roll_alarm_v2
          if adb logcat -d -s 'RingtonePlayer:W' 'AsyncRingtonePlayer:W' 'NotificationService:W' '*:S' \
            | grep -F 'app.rngdle.companion.debug.reminder-sound/sound/roll_alert.wav'; then exit 1; fi
          adb shell cmd statusbar expand-notifications
          sleep 1
          adb exec-out screencap -p > test-notification.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview-smoke
          path: |
            play.png
            rankings.png
            webview.log
            test-notification.png
            test-notification.log
            smoke-final.png
            reminder-default.wav
            reminder-muted.wav
            rollback.png
            rollback-saved.png
            rollback.log
            ${{ runner.temp }}/rngdle-emulator.log
